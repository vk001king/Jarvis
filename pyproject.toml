# Tooling configuration only — the app is launched with `python main.py` and
# installed with `python setup.py`; nothing here packages it.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["dashboard/static"]

[tool.ruff.lint]
# Errors that are bugs rather than taste: syntax errors, undefined names,
# and names that are assigned or imported and never used.
select = ["E9", "F63", "F7", "F82"]
